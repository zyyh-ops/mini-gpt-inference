[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mini-gpt-inference-runtime"
version = "0.1.0"
description = "Educational MiniGPT inference runtime with paged KV cache and recompute preemption"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["torch>=2.1"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[tool.setuptools]
packages = ["minivllm", "minigpt", "experiments"]
